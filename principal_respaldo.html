<div class="modal fade" id="cambiaContrasena" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="staticBackdropLabel">¡Importante!</h5>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-sm-12" align="center">
            Al ser la primera vez que ingresas, debes cambiar tu contraseña.
          </div>
        </div>
        <div class="row">
          <div class="col-sm-12" align="center">
            <small id="antigua" class="form-text text-muted">Antigua contraseña</small>
            <input type="password" class="form-control" id="antiguaContra">
          </div>
        </div>
        <div class="row">
          <div class="col-sm-12" align="center">
            <small id="antigua" class="form-text text-muted">Tu nueva contraseña</small>
            <input type="password" id="nuevaContra" class="form-control">
          </div>
        </div>

          <div class="col-sm-12" align="center">
            <small id="antigua" class="form-text text-muted">Confirma tu nueva contraseña</small>
            <input type="password" id="confNuevaContra" class="form-control">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-sm-12" align="center">
          
          <input type="checkbox" id="verPass" onclick="mostrarPassword()">Mostrar contraseñas
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" onclick="cambiaContrasena()"> Cambiar</button>
