	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<style>
		body, html {
			font-family: 'Inter', sans-serif !important;
			background-color: #0b0c10 !important;
		}
		.container-login100 {
			background: #0b0c10 !important;
			background-image: radial-gradient(circle at center, #1f2833 0%, #0b0c10 100%) !important;
		}
		.wrap-login100 {
			background: rgba(31, 40, 51, 0.8) !important;
			border: 1px solid rgba(255, 255, 255, 0.05);
			border-radius: 20px;
			box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5) !important;
			padding: 70px 50px !important;
			backdrop-filter: blur(10px);
		}
		.login100-form-title {
			font-family: 'Inter', sans-serif !important;
			color: #ffffff !important;
			font-weight: 600 !important;
			letter-spacing: 1px;
			padding-bottom: 40px !important;
		}
		.input100 {
			background: rgba(0, 0, 0, 0.3) !important;
			border-radius: 10px !important;
			color: #fff !important;
			border: 1px solid rgba(255, 255, 255, 0.1) !important;
			font-family: 'Inter', sans-serif !important;
			padding-left: 60px !important;
		}
		.input100:focus {
			border-color: #45a29e !important;
			background: rgba(0, 0, 0, 0.5) !important;
		}
		.focus-input100 {
			display: none !important;
		}
		.symbol-input100 {
			color: #c5c6c7 !important;
			padding-left: 20px !important;
		}
		.login100-form-btn {
			font-family: 'Inter', sans-serif !important;
			background: linear-gradient(135deg, #1f2833, #0b0c10) !important;
			border-radius: 10px !important;
			font-weight: 600 !important;
			letter-spacing: 0.5px;
			transition: all 0.3s ease !important;
			color: #66fcf1 !important;
			border: 1px solid rgba(102, 252, 241, 0.3) !important;
		}
		.login100-form-btn:hover {
			background: linear-gradient(135deg, #45a29e, #1f2833) !important;
			color: #ffffff !important;
			transform: translateY(-2px);
			box-shadow: 0 5px 15px rgba(102, 252, 241, 0.2) !important;
			border-color: #66fcf1 !important;
		}
		.txt1 {
			color: #c5c6c7 !important;
			font-family: 'Inter', sans-serif !important;
		}
		.txt2 {
			color: #66fcf1 !important;
			font-family: 'Inter', sans-serif !important;
			transition: color 0.3s ease;
		}
		.txt2:hover {
			color: #45a29e !important;
		}
		.wrap-input100 {
			margin-bottom: 20px !important;
		}
	</style>

<!--===============================================================================================-->

</head>
<body>
	
	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<div class="login100-pic js-tilt" data-tilt>
					<img src="images/Grupo-Emporium-Transparente-fondos-oscuros.png" alt="IMG">
				</div>

				<form class="login100-form validate-form" action="principal.html" method="POST" id="accesoLogin" target="">
					<span class="login100-form-title">
						Acceso
					</span>

					<div class="wrap-input100 validate-input" data-validate = "Por favor introduce un email válido: ex@abc.xyz">
						<input class="input100" id="mail" type="text" name="email" placeholder="Email">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-envelope" aria-hidden="true"></i>
						</span>
					</div>

					<div class="wrap-input100 validate-input" data-validate = "Este campo es obligatorio">
						<input class="input100" type="password" id="password" name="pass" placeholder="Password">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-lock" aria-hidden="true"></i>
						</span>
					</div>
					
					<div class="container-login100-form-btn">
						<button type="submit" class="login100-form-btn">
							Accesar
						</button>
					</div>

					<div class="text-center p-t-12">
						<span class="txt1">
							Olvidé mi
						</span>
						<a class="txt2" href="#">
							contraseña
						</a>
					</div>
				</form>
			</div>
		</div>
	</div>

			scale: 1.1
		})
	</script>
<!--===============================================================================================-->
	<script src="js/main.js"></script>

</body>
